# What happened in this repository in the last day, told for a standup.
# A deterministic step reads git, so no model spends tokens on it, and the
# note rests on the patch and not on a commit subject alone.
#
#   orchy run flows/standup/flow.yaml --with '{}'
#   orchy run flows/standup/flow.yaml --with '{"since":"3 days ago"}'
#
# The window is one day when the run supplies none.
name: standup
harness: pi
model: ollama/gpt-oss:120b
workspace: { kind: git, path: . }
takes:
  type: object
  properties: { since: { type: string } }

steps:
  - id: log
    kind: call
    module: log.ts
    returns:
      type: object
      required: [since, commits, diff]
      properties:
        since: { type: string }
        diff: { type: string }
        commits:
          type: array
          items:
            type: object
            required: [hash, subject]
            properties:
              hash: { type: string }
              subject: { type: string }

  - id: note
    kind: agent
    needs: [log]
    prompt: prompts/note.md
    tools: [read, grep]
    changes: nothing
    returns:
      type: object
      required: [note]
      properties: { note: { type: string } }
