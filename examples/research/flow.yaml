# Research a question with three readers, then one writer, then a check.
# The readers use the web, and only Claude Code has a web tool, so the flow
# names the harness once. `validate()` then refuses the flow under pi.
name: research
harness: claude
model: claude-sonnet-5
parallel: 3

steps:
  - id: question
    kind: agent
    prompt: prompts/question.md
    tools: [read]
    returns:
      type: object
      required: [question, angles]
      properties:
        question: { type: string }
        angles: { type: array, items: { type: string }, minItems: 3 }

  - id: reader
    kind: agent
    needs: [question]
    prompt: prompts/read.md
    tools: [web]
    returns: &finding
      type: object
      required: [angle, findings, sources]
      properties:
        angle: { type: string }
        findings: { type: array, items: { type: string } }
        sources: { type: array, items: { type: string } }
    # Three readers of one model. Each takes one angle from the question.
    fanout:
      - { name: first, with: { angle: 1 } }
      - { name: second, with: { angle: 2 } }
      - { name: third, with: { angle: 3 } }

  - id: brief
    kind: agent
    needs: [reader]
    model: claude-opus-4-5
    prompt: prompts/brief.md
    tools: [write]
    returns:
      type: object
      required: [file, claims]
      properties:
        file: { type: string }
        claims: { type: number }

  - id: check
    kind: agent
    needs: [brief]
    prompt: prompts/check.md
    tools: [read, web]
    returns:
      type: object
      required: [approved, findings]
      properties:
        approved: { type: boolean }
        findings: { type: array, items: { type: string } }
    cycle: { to: brief, when: { approved: false }, limit: 2, policy: accept }
