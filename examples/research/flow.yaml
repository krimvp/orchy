# Research a question with three readers, then one writer, then a check.
# The readers use the web, so this flow needs a harness that has web tools.
name: research
parallel: 3

steps:
  - id: question
    kind: agent
    harness: claude
    prompt: prompts/question.md
    tools: [read]
    returns:
      type: object
      required: [question, angles]
      properties:
        question: { type: string }
        angles: { type: array, items: { type: string }, minItems: 3 }

  - id: reader
    kind: agent
    needs: [question]
    harness: claude
    prompt: prompts/read.md
    tools: [web]
    returns: &finding
      type: object
      required: [angle, findings, sources]
      properties:
        angle: { type: string }
        findings: { type: array, items: { type: string } }
        sources: { type: array, items: { type: string } }
    fanout:
      - { name: first, model: claude-sonnet-5 }
      - { name: second, model: claude-sonnet-5 }
      - { name: third, model: claude-sonnet-5 }

  - id: brief
    kind: agent
    needs: [reader]
    harness: claude
    model: claude-opus-4-5
    prompt: prompts/brief.md
    tools: [write]
    returns:
      type: object
      required: [file, claims]
      properties:
        file: { type: string }
        claims: { type: number }

  - id: check
    kind: agent
    needs: [brief]
    harness: claude
    prompt: prompts/check.md
    tools: [read, web]
    returns:
      type: object
      required: [approved, findings]
      properties:
        approved: { type: boolean }
        findings: { type: array, items: { type: string } }
    cycle: { to: brief, when: { approved: false }, limit: 2, policy: accept }
