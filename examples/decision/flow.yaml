# Three advisors argue a decision from fixed stances, then one brief, then a
# person decides. It touches no files and needs no workspace.
name: decision
harness: pi
model: ollama/glm-5.2
parallel: 3

steps:
  - id: advisor
    kind: agent
    prompt: prompts/advise.md
    tools: [read]
    # The stance is a value, so one prompt carries the rules and each member
    # carries only what differs. A member prompt that sent the agent to read
    # the rules from a file found none, and invented an answer.
    takes:
      type: object
      required: [stance, argue]
      properties:
        stance: { type: string }
        argue: { type: string }
    returns: &opinion
      type: object
      required: [stance, position, risks, confidence]
      properties:
        stance: { type: string }
        position: { type: string }
        risks: { type: array, items: { type: string } }
        confidence: { type: number, minimum: 0, maximum: 1 }
    fanout:
      - { name: builder, with: { stance: builder, argue: "you argue for the change. Ask what the project gains, and what it loses by waiting." } }
      - { name: skeptic, with: { stance: skeptic, argue: "you argue against the change. Ask what breaks, what it costs to reverse, and who carries the cost." } }
      - { name: operator, with: { stance: operator, argue: "you run this in production at three in the morning. Ask what the failure looks like, who sees it first, and what they can do about it." } }

  - id: brief
    kind: agent
    needs: [advisor]
    prompt: prompts/brief.md
    tools: [read]
    returns:
      type: object
      required: [recommendation, disagreement, reversible]
      properties:
        recommendation: { type: string }
        disagreement: { type: array, items: { type: string } }
        reversible: { type: boolean }

  - id: decide
    kind: gate
    needs: [brief]
    question: >
      Read the brief. Answer with {"choice":"yes"} or {"choice":"no"} and a
      reason.
    returns:
      type: object
      required: [choice, reason]
      properties:
        choice: { type: string, enum: [yes, no] }
        reason: { type: string }
