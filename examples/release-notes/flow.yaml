# Turn a range of commits into release notes a reader understands.
# A deterministic step reads git, so no model spends tokens on it, and the
# notes rest on the patch and not on a commit subject alone.
#
#   orchy run examples/release-notes/flow.yaml --with '{}'
#   orchy run examples/release-notes/flow.yaml --with '{"range":"v0.1.0..HEAD"}'
#
# The range is everything after the last tag when the run supplies none, and
# the whole history of a clone that holds no tag.
name: release-notes
harness: pi
model: ollama/glm-5.2
workspace: { kind: git, path: . }
takes:
  type: object
  properties: { range: { type: string } }

steps:
  - id: log
    kind: call
    module: log.ts
    returns:
      type: object
      required: [range, commits, diff]
      properties:
        range: { type: string }
        diff: { type: string }
        commits:
          type: array
          items:
            type: object
            required: [hash, subject]
            properties:
              hash: { type: string }
              subject: { type: string }

  - id: draft
    kind: agent
    needs: [log]
    prompt: prompts/draft.md
    tools: [read, grep, find]
    returns: &notes
      type: object
      required: [markdown, headline]
      properties:
        markdown: { type: string }
        headline: { type: string }

  - id: check
    kind: agent
    needs: [draft, log]
    prompt: prompts/check.md
    tools: [read, grep]
    changes: nothing
    returns:
      type: object
      required: [approved, findings]
      properties:
        approved: { type: boolean }
        findings: { type: array, items: { type: string } }
    cycle: { to: draft, when: { approved: false }, limit: 2, policy: accept }
